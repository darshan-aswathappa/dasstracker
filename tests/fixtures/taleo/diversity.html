<!doctype html><html><head><title>Diversity - Part 1</title></head><body>
<form method="POST" action="/careersection/careersection/candidateacquisition/flow.jsf?step=attachments">
  <h3>Diversity</h3>
  <div class="question"><span><em>*</em>1.Gender</span>
    <div><input type="radio" name="g" id="g1"><label for="g1">Female</label></div>
    <div><input type="radio" name="g" id="g2"><label for="g2">Male</label></div>
    <div><input type="radio" name="g" id="g3"><label for="g3">Non-Binary</label></div>
    <div><input type="radio" name="g" id="g4"><label for="g4">Other</label></div>
    <div><input type="radio" name="g" id="g5"><label for="g5">Prefer not to answer/Not specified</label></div>
  </div>
  <div class="question"><span><em>*</em>2.Veterans Invitation to Self Identify</span>
    <div><input type="radio" name="v" id="v1"><label for="v1">I do not wish to disclose this information</label></div>
    <div><input type="radio" name="v" id="v2"><label for="v2">Veteran (VA Ineligible)</label></div>
    <div><input type="radio" name="v" id="v3"><label for="v3">Protected Veteran</label></div>
    <div><input type="radio" name="v" id="v4"><label for="v4">Not a Protected Veteran</label></div>
  </div>
  <div class="question"><span><em>*</em>3.Race (Please select the ethnic group(s) that apply to you)</span>
    <div><input type="checkbox" name="r" id="r1"><label for="r1">White</label></div>
    <div><input type="checkbox" name="r" id="r2"><label for="r2">Black / African American</label></div>
    <div><input type="checkbox" name="r" id="r3"><label for="r3">Hispanic / Latino</label></div>
    <div><input type="checkbox" name="r" id="r4"><label for="r4">Asian</label></div>
    <div><input type="checkbox" name="r" id="r5"><label for="r5">American Indian / Alaskan Native</label></div>
    <div><input type="checkbox" name="r" id="r6"><label for="r6">I prefer not to answer</label></div>
  </div>
  <button type="submit">CONTINUE</button>
</form>
</body></html>
